name: toolbox-platform
x-backend: &backend
  image: toolbox-platform-backend:0.2.0
  build:
    context: ..
    dockerfile: deploy/Dockerfile.backend
  env_file: ../.env
  environment: &backend-env
    PYTHONPATH: /srv/backend
    ENVIRONMENT: prod
    LOGGER_LEVEL: INFO
    DEBUG: 'false'
    TOOLBOX_ENABLED: 'true'
    AUTH_COOKIE_NAME: fa_session
    HTTPS_REDIRECT: 'false'
    ALLOWED_HOSTS: '${FA_ALLOWED_HOSTS:-["127.0.0.1","localhost","api"]}'
    CAPTCHA_ENABLE: 'false'
    DOCS_URL: /api/docs
    REDOC_URL: /api/redoc
    DATABASE_TYPE: mysql
    DATABASE_HOST: mysql
    DATABASE_USER: toolbox
    DATABASE_PASSWORD: ${DB_PASSWORD}
    DATABASE_NAME: toolbox
    REDIS_HOST: redis
    REDIS_DB_NAME: '0'
    SECRET_KEY: ${FA_SECRET_KEY:?Generate a FastapiAdmin signing key}
    PASSWORD_MIN_LENGTH: '8'
    SCHEDULER_ALLOW_CODE_EXEC: 'false'
  networks: [private]
  restart: unless-stopped
  init: true
  tmpfs:
    - /tmp:size=768m,mode=1777
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: toolbox
      MYSQL_USER: toolbox
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/start.ps1 first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/start.ps1 first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql-data:/var/lib/mysql, ./mysql/toolbox.cnf:/etc/mysql/conf.d/toolbox.cnf:ro]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    volumes: [redis-data:/data, ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${TB_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${TB_S3_SECRET_KEY}
    volumes: [minio-data:/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
  bootstrap:
    <<: *backend
    restart: 'no'
    command: [python, -m, app.toolbox.services.bootstrap]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
  api:
    <<: *backend
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/api/health]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *backend
    command: [celery, -A, workers.celery_app:celery, worker, --loglevel=INFO, --concurrency=1, -Q, toolbox.media_cpu]
    mem_limit: 2g
    cpus: 2
    pids_limit: 160
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      egress: {condition: service_started}
  dispatcher:
    <<: *backend
    command: [python, -m, app.toolbox.jobs.outbox]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
  search-worker:
    <<: *backend
    command: [celery, -A, workers.celery_app:celery, worker, --loglevel=INFO, --concurrency=1, -Q, toolbox-search]
    environment:
      <<: *backend-env
      TB_RESOURCE_PROFILE: search
    mem_limit: 512m
    cpus: 1
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      egress: {condition: service_started}
  download-worker:
    <<: *backend
    command: [celery, -A, workers.celery_app:celery, worker, --loglevel=INFO, --concurrency=2, -Q, toolbox.download]
    environment:
      <<: *backend-env
      TB_RESOURCE_PROFILE: download
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      egress: {condition: service_started}
  provider-worker:
    <<: *backend
    command: [celery, -A, workers.celery_app:celery, worker, --loglevel=INFO, --concurrency=2, -Q, toolbox.provider_io]
    environment:
      <<: *backend-env
      TB_RESOURCE_PROFILE: provider_io
    mem_limit: 512m
    cpus: 1
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      tts-gateway: {condition: service_started}
  egress:
    <<: *backend
    command: [python, -m, app.toolbox.runtime.egress]
    networks: [private, outbound]
  tts-gateway:
    <<: *backend
    command: [uvicorn, gateway:app, --app-dir, /srv/services/voice-engine, --host, 0.0.0.0, --port, '8898']
    networks: [private, outbound]
  web:
    image: toolbox-platform-web:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18990}:80']
    networks: [private, edge]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}

networks:
  private: {internal: true}
  outbound: {}
  edge: {}
volumes:
  mysql-data: {}
  redis-data: {}
  minio-data: {}
