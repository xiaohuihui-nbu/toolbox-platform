server {
    listen 80;
    server_tokens off;
    client_max_body_size 101m;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location = /admin { return 302 /admin/; }
    location /admin/ { index admin.html; try_files $uri $uri/ /admin/admin.html; }
    location / { try_files $uri $uri/ /index.html; }
}
